# Template (reusable) workflow that receives a LAMMPS version tag or branch name.
# The workflow builds LAMMPS, then builds PAPRECA and the source-tests executable.
# It is used by the scheduled build and functionality tests and can also test
# compatibility with different LAMMPS versions.

name: Build and test reusable

on:
  workflow_call:
    inputs:
      clone_type:
        description: 'Set this to either "branch" or "tag" to clone LAMMPS using a branch or a tag name, respectively'
        required: true
        type: string
      clone_name:
        description: 'This is the branch or tag name'
        required: true
        type: string
    outputs:
      lammps_sha:
        description: 'Exact LAMMPS commit used for this workflow run'
        value: ${{ jobs.buildLAMMPS.outputs.lammps_sha }}

jobs:
  buildLAMMPS:
    runs-on: ubuntu-24.04
    outputs:
      lammps_sha: ${{ steps.get-lammps-commit.outputs.sha }}

    steps:
      - name: Checkout PAPRECA
        uses: actions/checkout@v6

      - name: Clone a specific LAMMPS branch
        if: ${{ inputs.clone_type == 'branch' }}
        run: |
          git clone --depth 1 --single-branch --branch "${{ inputs.clone_name }}" https://github.com/lammps/lammps.git mylammps

      - name: Clone a specific LAMMPS tag
        if: ${{ inputs.clone_type == 'tag' }}
        run: |
          git clone --depth 1 --single-branch --branch "${{ inputs.clone_name }}" https://github.com/lammps/lammps.git mylammps

      - name: Get exact LAMMPS commit SHA
        id: get-lammps-commit
        run: echo "sha=$(git -C mylammps rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install LAMMPS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mpich

      - name: Record the build toolchain
        id: toolchain
        run: |
          toolchain="$(gcc -dumpfullversion)-$(cmake --version | head -n 1)-$(dpkg-query -W -f='${Version}' mpich)"
          echo "hash=$(printf '%s' "$toolchain" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create LAMMPS artifacts directory
        run: mkdir -p "lammps_artifacts_${{ inputs.clone_name }}"

      - name: Cache the exact LAMMPS build
        id: cache-lammps
        uses: actions/cache@v6
        with:
          path: lammps_artifacts_${{ inputs.clone_name }}
          key: ${{ runner.os }}-${{ runner.arch }}-lammps-${{ steps.get-lammps-commit.outputs.sha }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('source/libraries/LAMMPS/fix_papreca.h', 'source/libraries/LAMMPS/fix_papreca.cpp') }}

      - name: Configure and build LAMMPS
        if: ${{ steps.cache-lammps.outputs.cache-hit != 'true' }}
        run: |
          cp "$GITHUB_WORKSPACE/source/libraries/LAMMPS/fix_papreca.h" mylammps/src/
          cp "$GITHUB_WORKSPACE/source/libraries/LAMMPS/fix_papreca.cpp" mylammps/src/
          cmake \
            -S mylammps/cmake \
            -B mylammps/build \
            -DPKG_KOKKOS=on \
            -DPKG_KSPACE=on \
            -DPKG_MOLECULE=on \
            -DPKG_RIGID=on \
            -DPKG_QEQ=on \
            -DBUILD_LIB=on \
            -DBUILD_SHARED_LIBS=on
          cmake --build mylammps/build

      - name: Copy LAMMPS executable and libraries
        if: ${{ steps.cache-lammps.outputs.cache-hit != 'true' }}
        run: |
          cp mylammps/build/lmp "lammps_artifacts_${{ inputs.clone_name }}/"
          cp -L mylammps/build/liblammps.so* "lammps_artifacts_${{ inputs.clone_name }}/"
          cp mylammps/build/liblammps.pc "lammps_artifacts_${{ inputs.clone_name }}/"

      - name: Verify the restored or newly built LAMMPS artifacts
        run: |
          chmod -R +rwx "lammps_artifacts_${{ inputs.clone_name }}"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}:${LD_LIBRARY_PATH:-}" \
            "./lammps_artifacts_${{ inputs.clone_name }}/lmp" -h

      - name: Upload the exact LAMMPS build
        uses: actions/upload-artifact@v7
        with:
          name: lammps-artifacts_${{ inputs.clone_name }}_${{ steps.get-lammps-commit.outputs.sha }}
          path: lammps_artifacts_${{ inputs.clone_name }}
          if-no-files-found: error

  buildPAPRECA:
    needs: buildLAMMPS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PAPRECA
        uses: actions/checkout@v6

      - name: Checkout the exact LAMMPS commit used by the build job
        run: |
          git init mylammps
          git -C mylammps remote add origin https://github.com/lammps/lammps.git
          git -C mylammps fetch --depth 1 origin "${{ needs.buildLAMMPS.outputs.lammps_sha }}"
          git -C mylammps checkout --detach FETCH_HEAD
          test "$(git -C mylammps rev-parse HEAD)" = "${{ needs.buildLAMMPS.outputs.lammps_sha }}"

      - name: Download the exact LAMMPS build
        uses: actions/download-artifact@v8
        with:
          name: lammps-artifacts_${{ inputs.clone_name }}_${{ needs.buildLAMMPS.outputs.lammps_sha }}
          path: lammps_artifacts_${{ inputs.clone_name }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mpich

      - name: Build PAPRECA
        run: |
          chmod -R +rwx "$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}/"
          cmake \
            -S "$GITHUB_WORKSPACE/Installation/CMake" \
            -B "$GITHUB_WORKSPACE/mypapreca/build" \
            -DLAMMPS_SRC_DIR="$GITHUB_WORKSPACE/mylammps/src/" \
            -DLAMMPS_LIB_DIR="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}/"
          cmake --build "$GITHUB_WORKSPACE/mypapreca/build"

      - name: Build source-tests executable
        run: |
          chmod -R +rwx "$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}/"
          cmake \
            -S "$GITHUB_WORKSPACE/tests/source tests" \
            -B "$GITHUB_WORKSPACE/tests/source tests/build" \
            -DLAMMPS_SRC_DIR="$GITHUB_WORKSPACE/mylammps/src/" \
            -DLAMMPS_LIB_DIR="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}" \
            -DPAPRECA_SRC_DIR="$GITHUB_WORKSPACE/source"
          cmake --build "$GITHUB_WORKSPACE/tests/source tests/build"

      - name: Collect PAPRECA executables
        run: |
          mkdir -p "papreca_artifacts_${{ inputs.clone_name }}"
          cp mypapreca/build/papreca "papreca_artifacts_${{ inputs.clone_name }}/"
          cp "$GITHUB_WORKSPACE/tests/source tests/build/source_tests" "papreca_artifacts_${{ inputs.clone_name }}/"

      - name: Upload PAPRECA executables
        uses: actions/upload-artifact@v7
        with:
          name: papreca-artifacts_${{ inputs.clone_name }}
          path: papreca_artifacts_${{ inputs.clone_name }}
          if-no-files-found: error
