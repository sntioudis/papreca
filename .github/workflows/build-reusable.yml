# Template (reusable) workflow that receives a LAMMPS version tag or branch name.
# The workflow builds LAMMPS, then builds PAPRECA and the source-tests executable.
#
# Diagnostics are captured during both build jobs so that binaries reused on
# later GitHub-hosted runners can be compared against their build environment.

name: Build and test reusable
on:
  workflow_call:
    inputs:
      clone_type:
        description: 'Set this to either "branch" or "tag" to clone LAMMPS using a branch or a tag name, respectively'
        required: true
        type: string
      clone_name:
        description: 'This is the branch or tag name'
        required: true
        type: string
    outputs:
      lammps_sha:
        description: 'Exact LAMMPS commit used for this workflow run'
        value: ${{ jobs.buildLAMMPS.outputs.lammps_sha }}

# Ubuntu 24.04's MPICH package is built on UCX and is unreliable on hosted
# runners with partially exposed RDMA devices. Use Open MPI's standard
# shared-memory/TCP path and explicitly exclude UCX and InfiniBand transports.
env:
  OMPI_MCA_pml: ob1
  OMPI_MCA_btl: self,vader,tcp
  OMPI_MCA_btl_base_warn_component_unused: "0"

jobs:
  buildLAMMPS:
    runs-on: ubuntu-24.04
    outputs:
      lammps_sha: ${{ steps.get-lammps-commit.outputs.sha }}

    steps:
      - name: Checkout PAPRECA
        uses: actions/checkout@v7

      - name: Clone a specific LAMMPS branch
        if: ${{ inputs.clone_type == 'branch' }}
        run: |
          git clone \
            --depth 1 \
            --single-branch \
            --branch "${{ inputs.clone_name }}" \
            https://github.com/lammps/lammps.git \
            mylammps

      - name: Clone a specific LAMMPS tag
        if: ${{ inputs.clone_type == 'tag' }}
        run: |
          git clone \
            --depth 1 \
            --single-branch \
            --branch "${{ inputs.clone_name }}" \
            https://github.com/lammps/lammps.git \
            mylammps

      - name: Get exact LAMMPS commit SHA
        id: get-lammps-commit
        run: echo "sha=$(git -C mylammps rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            openmpi-bin \
            libopenmpi-dev

          sudo update-alternatives --set mpi /usr/bin/mpicc.openmpi
          sudo update-alternatives --set mpirun /usr/bin/mpirun.openmpi

          mpicc --showme:version
          mpiexec --version

      - name: Record the build toolchain
        id: toolchain
        run: |
          toolchain="$(
            printf '%s\n' \
              "$(gcc -dumpfullversion)" \
              "$(cmake --version | head -n 1)" \
              "$(dpkg-query -W -f='${Version}' openmpi-bin)" \
              "$(dpkg-query -W -f='${Version}' libopenmpi-dev)"
          )"
          echo "hash=$(printf '%s' "$toolchain" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create LAMMPS artifacts directory
        run: mkdir -p "lammps_artifacts_${{ inputs.clone_name }}"

      - name: Cache the exact LAMMPS build
        id: cache-lammps
        uses: actions/cache@v6
        with:
          path: lammps_artifacts_${{ inputs.clone_name }}
          key: ${{ runner.os }}-${{ runner.arch }}-openmpi-lammps-${{ steps.get-lammps-commit.outputs.sha }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('source/libraries/LAMMPS/fix_papreca.h', 'source/libraries/LAMMPS/fix_papreca.cpp') }}

      - name: Configure and build LAMMPS
        if: ${{ steps.cache-lammps.outputs.cache-hit != 'true' }}
        run: |
          cp "$GITHUB_WORKSPACE/source/libraries/LAMMPS/fix_papreca.h" mylammps/src/
          cp "$GITHUB_WORKSPACE/source/libraries/LAMMPS/fix_papreca.cpp" mylammps/src/

          cmake \
            -S mylammps/cmake \
            -B mylammps/build \
            -DPKG_KOKKOS=on \
            -DPKG_KSPACE=on \
            -DPKG_MOLECULE=on \
            -DPKG_RIGID=on \
            -DPKG_QEQ=on \
            -DBUILD_MPI=on \
            -DBUILD_LIB=on \
            -DBUILD_SHARED_LIBS=on

          cmake --build mylammps/build

      - name: Copy LAMMPS executable and libraries
        if: ${{ steps.cache-lammps.outputs.cache-hit != 'true' }}
        run: |
          cp mylammps/build/lmp "lammps_artifacts_${{ inputs.clone_name }}/"
          cp -L mylammps/build/liblammps.so* "lammps_artifacts_${{ inputs.clone_name }}/"
          cp mylammps/build/liblammps.pc "lammps_artifacts_${{ inputs.clone_name }}/"

      - name: Verify the restored or newly built LAMMPS artifacts
        run: |
          artifact_dir="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}"

          chmod -R +rwx "$artifact_dir"
          test -x "$artifact_dir/lmp"
          test -s "$artifact_dir/liblammps.so"
          test -s "$artifact_dir/liblammps.pc"

          export LD_LIBRARY_PATH="$artifact_dir:${LD_LIBRARY_PATH:-}"
          ldd "$artifact_dir/lmp" | tee /tmp/lammps-ldd.txt

          if grep -q "not found" /tmp/lammps-ldd.txt; then
            echo "LAMMPS has unresolved shared-library dependencies." >&2
            exit 1
          fi

          if ! ldd "$artifact_dir/lmp" | grep -q "libmpi"; then
            echo "LAMMPS was not linked to MPI." >&2
            exit 1
          fi

      - name: Record LAMMPS build environment
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          artifact_dir="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}"
          out="$GITHUB_WORKSPACE/diagnostics/lammps-build-environment.txt"

          {
            echo "========================================"
            echo "LAMMPS BUILD ENVIRONMENT"
            echo "========================================"

            echo
            echo "=== GitHub Actions ==="
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            echo "lammps_cache_hit=${{ steps.cache-lammps.outputs.cache-hit }}"

            echo
            echo "=== Source revisions ==="
            echo "lammps_requested_type=${{ inputs.clone_type }}"
            echo "lammps_requested_ref=${{ inputs.clone_name }}"
            echo "lammps_expected_sha=${{ steps.get-lammps-commit.outputs.sha }}"
            git -C mylammps rev-parse HEAD
            git -C mylammps log -1 --format='lammps_commit=%H%ncommit_date=%cI%nsubject=%s'
            echo "papreca_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || echo unknown)"

            echo
            echo "=== Operating system ==="
            uname -a
            cat /etc/os-release

            echo
            echo "=== CPU ==="
            lscpu

            echo
            echo "=== Toolchain ==="
            gcc --version
            g++ --version
            cmake --version
            ld --version | head -n 1

            echo
            echo "=== MPI ==="
            which mpicc
            which mpiexec
            mpicc --showme:version
            mpicc --showme
            mpiexec --version
            ompi_info --version

            echo
            echo "=== Open MPI environment ==="
            echo "OMPI_MCA_pml=${OMPI_MCA_pml:-unset}"
            echo "OMPI_MCA_btl=${OMPI_MCA_btl:-unset}"
            echo "OMPI_MCA_btl_base_warn_component_unused=${OMPI_MCA_btl_base_warn_component_unused:-unset}"

            echo
            echo "=== Important packages ==="
            dpkg-query -W -f='${Package}=${Version}\n' \
              libc6 \
              libstdc++6 \
              openmpi-bin \
              libopenmpi-dev \
              gcc \
              g++ \
              cmake

            echo
            echo "=== LAMMPS artifact listing ==="
            ls -lah "$artifact_dir"

            echo
            echo "=== LAMMPS binary hashes ==="
            sha256sum "$artifact_dir/lmp"
            sha256sum "$artifact_dir"/liblammps.so*

            echo
            echo "=== LAMMPS executable linkage ==="
            export LD_LIBRARY_PATH="$artifact_dir:${LD_LIBRARY_PATH:-}"
            ldd "$artifact_dir/lmp"

            echo
            echo "=== liblammps linkage ==="
            ldd "$artifact_dir/liblammps.so"

            echo
            echo "=== Hashes of host libraries resolved for LAMMPS ==="
            ldd "$artifact_dir/lmp" 2>/dev/null |
              awk '/=> \// {print $3} /^\// {print $1}' |
              sort -u |
              while read -r lib; do
                [ -f "$lib" ] && sha256sum "$lib"
              done
          } 2>&1 | tee "$out"

          dpkg-query -W -f='${Package}\t${Version}\n' 2>/dev/null |
            sort \
            > "$GITHUB_WORKSPACE/diagnostics/lammps-build-packages.txt"

      - name: Upload LAMMPS build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-lammps-build-${{ inputs.clone_name }}-${{ steps.get-lammps-commit.outputs.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the exact LAMMPS build
        uses: actions/upload-artifact@v7
        with:
          name: lammps-artifacts_${{ inputs.clone_name }}_${{ steps.get-lammps-commit.outputs.sha }}
          path: lammps_artifacts_${{ inputs.clone_name }}
          if-no-files-found: error
          retention-days: 30

  buildPAPRECA:
    needs: buildLAMMPS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PAPRECA
        uses: actions/checkout@v7

      - name: Checkout the exact LAMMPS commit used by the build job
        run: |
          git init mylammps
          git -C mylammps remote add origin https://github.com/lammps/lammps.git
          git -C mylammps fetch --depth 1 origin "${{ needs.buildLAMMPS.outputs.lammps_sha }}"
          git -C mylammps checkout --detach FETCH_HEAD
          test "$(git -C mylammps rev-parse HEAD)" = "${{ needs.buildLAMMPS.outputs.lammps_sha }}"

      - name: Download the exact LAMMPS build
        uses: actions/download-artifact@v8
        with:
          name: lammps-artifacts_${{ inputs.clone_name }}_${{ needs.buildLAMMPS.outputs.lammps_sha }}
          path: lammps_artifacts_${{ inputs.clone_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            openmpi-bin \
            libopenmpi-dev

          sudo update-alternatives --set mpi /usr/bin/mpicc.openmpi
          sudo update-alternatives --set mpirun /usr/bin/mpirun.openmpi

          mpicc --showme:version
          mpiexec --version

      - name: Build PAPRECA
        run: |
          chmod -R +rwx "$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}/"
          cmake \
            -S "$GITHUB_WORKSPACE/Installation/CMake" \
            -B "$GITHUB_WORKSPACE/mypapreca/build" \
            -DLAMMPS_SRC_DIR="$GITHUB_WORKSPACE/mylammps/src/" \
            -DLAMMPS_LIB_DIR="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}/"

          cmake --build "$GITHUB_WORKSPACE/mypapreca/build"

      - name: Build source-tests executable
        run: |
          chmod -R +rwx "$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}/"
          cmake \
            -S "$GITHUB_WORKSPACE/tests/source tests" \
            -B "$GITHUB_WORKSPACE/tests/source tests/build" \
            -DLAMMPS_SRC_DIR="$GITHUB_WORKSPACE/mylammps/src/" \
            -DLAMMPS_LIB_DIR="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}" \
            -DPAPRECA_SRC_DIR="$GITHUB_WORKSPACE/source"

          cmake --build "$GITHUB_WORKSPACE/tests/source tests/build"

      - name: Collect PAPRECA executables
        run: |
          mkdir -p "papreca_artifacts_${{ inputs.clone_name }}"
          cp mypapreca/build/papreca "papreca_artifacts_${{ inputs.clone_name }}/"
          cp "$GITHUB_WORKSPACE/tests/source tests/build/source_tests" \
            "papreca_artifacts_${{ inputs.clone_name }}/"

      - name: Verify PAPRECA uses Open MPI
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}:${LD_LIBRARY_PATH:-}"
          ldd "papreca_artifacts_${{ inputs.clone_name }}/papreca" | tee /tmp/papreca-ldd.txt

          if grep -q "not found" /tmp/papreca-ldd.txt; then
            echo "PAPRECA has unresolved shared-library dependencies." >&2
            exit 1
          fi

          if ! grep -q "libmpi" /tmp/papreca-ldd.txt; then
            echo "PAPRECA was not linked to MPI." >&2
            exit 1
          fi

      - name: Record PAPRECA build environment
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"

          lammps_dir="$GITHUB_WORKSPACE/lammps_artifacts_${{ inputs.clone_name }}"
          papreca_dir="$GITHUB_WORKSPACE/papreca_artifacts_${{ inputs.clone_name }}"
          out="$GITHUB_WORKSPACE/diagnostics/papreca-build-environment.txt"

          {
            echo "========================================"
            echo "PAPRECA BUILD ENVIRONMENT"
            echo "========================================"

            echo
            echo "=== GitHub Actions ==="
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"

            echo
            echo "=== Source revisions ==="
            echo "papreca_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "lammps_expected_sha=${{ needs.buildLAMMPS.outputs.lammps_sha }}"
            echo "lammps_checked_out_sha=$(git -C mylammps rev-parse HEAD 2>/dev/null || echo unknown)"

            echo
            echo "=== Operating system ==="
            uname -a
            cat /etc/os-release

            echo
            echo "=== CPU ==="
            lscpu

            echo
            echo "=== Toolchain ==="
            gcc --version
            g++ --version
            cmake --version
            ld --version | head -n 1

            echo
            echo "=== MPI ==="
            which mpicc
            which mpiexec
            mpicc --showme:version
            mpicc --showme
            mpiexec --version
            ompi_info --version

            echo
            echo "=== Open MPI environment ==="
            echo "OMPI_MCA_pml=${OMPI_MCA_pml:-unset}"
            echo "OMPI_MCA_btl=${OMPI_MCA_btl:-unset}"
            echo "OMPI_MCA_btl_base_warn_component_unused=${OMPI_MCA_btl_base_warn_component_unused:-unset}"

            echo
            echo "=== Important packages ==="
            dpkg-query -W -f='${Package}=${Version}\n' \
              libc6 \
              libstdc++6 \
              openmpi-bin \
              libopenmpi-dev \
              gcc \
              g++ \
              cmake

            echo
            echo "=== Artifact listings ==="
            ls -lah "$lammps_dir"
            ls -lah "$papreca_dir"

            echo
            echo "=== Exact binary hashes ==="
            sha256sum "$lammps_dir/lmp"
            sha256sum "$lammps_dir"/liblammps.so*
            sha256sum "$papreca_dir/papreca"
            sha256sum "$papreca_dir/source_tests"

            echo
            echo "=== PAPRECA linkage ==="
            export LD_LIBRARY_PATH="$lammps_dir:${LD_LIBRARY_PATH:-}"
            ldd "$papreca_dir/papreca"

            echo
            echo "=== LAMMPS linkage on the PAPRECA build runner ==="
            ldd "$lammps_dir/lmp"

            echo
            echo "=== Hashes of host libraries resolved for PAPRECA ==="
            ldd "$papreca_dir/papreca" 2>/dev/null |
              awk '/=> \// {print $3} /^\// {print $1}' |
              sort -u |
              while read -r lib; do
                [ -f "$lib" ] && sha256sum "$lib"
              done
          } 2>&1 | tee "$out"

          dpkg-query -W -f='${Package}\t${Version}\n' 2>/dev/null |
            sort \
            > "$GITHUB_WORKSPACE/diagnostics/papreca-build-packages.txt"

      - name: Upload PAPRECA build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-papreca-build-${{ inputs.clone_name }}-${{ needs.buildLAMMPS.outputs.lammps_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload PAPRECA executables
        uses: actions/upload-artifact@v7
        with:
          name: papreca-artifacts_${{ inputs.clone_name }}
          path: papreca_artifacts_${{ inputs.clone_name }}
          if-no-files-found: error
          retention-days: 30
